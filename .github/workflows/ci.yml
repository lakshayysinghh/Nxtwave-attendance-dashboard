name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: attendance
          POSTGRES_DB: attendance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U attendance" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://attendance:attendance@localhost:5432/attendance?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Every migration has a down file
        run: |
          status=0
          for up in migrations/*.up.sql; do
            down="${up%.up.sql}.down.sql"
            [ -f "$down" ] || { echo "missing $down"; status=1; }
          done
          exit $status

      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: sqlc generated code is up to date
        run: sqlc diff

      - run: go vet ./...
      - run: go test -race ./...

      - name: Migrations apply, roll back and re-apply
        run: |
          go run ./cmd/server migrate up
          go run ./cmd/server migrate down
          go run ./cmd/server migrate up

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
